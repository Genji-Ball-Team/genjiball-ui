name: Bug report
description: A component, token or icon doesn't look or behave as it should
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The component, the page or app it's in (website, host tool), the browser and the steps.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
