<section class="g-section">
  <h2>By time, three players (hover or use the arrow keys)</h2>
  <gb-panel label="Ratings">
    <gb-compare-chart id="by-time" axis="time" label="Ratings over time"></gb-compare-chart>
  </gb-panel>
</section>

<section class="g-section">
  <h2>By match, two players</h2>
  <gb-panel label="Ratings">
    <gb-compare-chart id="by-match" height="200"></gb-compare-chart>
  </gb-panel>
</section>

<section class="g-section">
  <h2>One point each</h2>
  <gb-panel label="Ratings">
    <gb-compare-chart id="one"></gb-compare-chart>
  </gb-panel>
</section>

<section class="g-section">
  <h2>Loading</h2>
  <gb-panel label="Ratings">
    <section aria-busy="true" aria-label="Ratings" class="g-stack" style="gap: 6px">
      <gb-skeleton style="inline-size: 30%"></gb-skeleton>
      <gb-skeleton block style="block-size: 200px"></gb-skeleton>
    </section>
  </gb-panel>
</section>

<section class="g-section">
  <h2>No matches</h2>
  <gb-panel label="Ratings">
    <gb-empty>None of these players has a rated match yet.</gb-empty>
  </gb-panel>
</section>

<script type="module">
  // Seeded walks, so the page looks the same on every load.
  function walk(start, steps, drift, seed, every) {
    let rating = start;
    let state = seed;
    const random = () => (state = (state * 16807) % 2147483647) / 2147483647;
    const day = Date.parse("2026-10-01T18:00:00Z");
    return Array.from({ length: steps }, (_, i) => {
      rating += Math.round((random() - 0.5) * 50 + drift);
      return {
        rating,
        at: day + i * every * 3_600_000 + Math.round(random() * 3_600_000),
        label: `Match #${400 + i}`,
        href: "#",
      };
    });
  }
  const tiers = [
    { tier: "master", label: "Master", threshold: 1800 },
    { tier: "grandmaster", label: "Grandmaster", threshold: 1900 },
  ];
  const byTime = document.getElementById("by-time");
  byTime.series = [
    { name: "Hanzo_Main", points: walk(1790, 24, 5, 7, 30) },
    { name: "Dragonblade", points: walk(1830, 14, 3, 11, 50) },
    { name: "Ryujin", points: walk(1740, 9, 9, 13, 70) },
  ];
  byTime.tiers = tiers;
  const byMatch = document.getElementById("by-match");
  byMatch.series = [
    { name: "Hanzo_Main", points: walk(1790, 24, 5, 7, 30) },
    { name: "Dragonblade", points: walk(1830, 14, 3, 11, 50) },
  ];
  byMatch.tiers = tiers;
  document.getElementById("one").series = [
    { name: "Hanzo_Main", points: [{ rating: 1812 }] },
    { name: "Dragonblade", points: [{ rating: 1790 }] },
  ];
  for (const chart of [byTime, byMatch])
    chart.addEventListener("open", (event) => event.preventDefault());
</script>
