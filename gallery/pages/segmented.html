<section class="g-section">
  <h2>Buttons</h2>
  <div class="g-row">
    <figure class="g-state">
      <gb-segmented label="View" value="rating">
        <button value="rating">Rating</button>
        <button value="places">Places</button>
      </gb-segmented>
      <figcaption>Two options</figcaption>
    </figure>
    <figure class="g-state">
      <gb-segmented label="Range" id="range-demo" value="30">
        <button value="7">7 days</button>
        <button value="30">30 days</button>
        <button value="90">90 days</button>
        <button value="all">All</button>
      </gb-segmented>
      <figcaption>Four options. Arrow keys move the choice</figcaption>
    </figure>
    <figure class="g-state">
      <gb-segmented label="Disabled option" value="a">
        <button value="a">Rounds</button>
        <button value="b" disabled>Tourneys</button>
        <button value="c">Matches</button>
      </gb-segmented>
      <figcaption>Disabled option, skipped by the arrows</figcaption>
    </figure>
  </div>
</section>

<section class="g-section">
  <h2>Links</h2>
  <div class="g-row">
    <figure class="g-state">
      <gb-segmented label="Region">
        <a href="#eu" aria-current="true">EU</a>
        <a href="#na">NA</a>
      </gb-segmented>
      <figcaption>Each option is a page; Tab reaches every link</figcaption>
    </figure>
  </div>
</section>

<script type="module">
  const range = document.getElementById("range-demo");
  range.addEventListener("change", () => {
    range.closest("figure").querySelector("figcaption").textContent = `Chosen: ${range.value}`;
  });
</script>
